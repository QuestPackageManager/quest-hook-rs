name: Tests
on: [push, pull_request]

# The feature set previously pulled in by cargo's own defaults, minus the
# hook backend (each job below adds whichever one its target needs) and the
# il2cpp version (supplied per matrix entry instead).
env:
  default_features: serde,util,cache,bindgen

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        unity: [il2cpp_v31, il2cpp_v29]
        # unity: [il2cpp_v31, il2cpp_v29, il2cpp_v24, unity2018]
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          override: true
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target/
          key: tests-${{ matrix.os }}-${{ matrix.unity }}-${{ hashFiles('**/Cargo.toml') }}

      # Building with default features (bindgen) shells out to qpm in
      # libil2cpp's build.rs
      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: false
          cache: false
          resolve_ndk: false

      # --no-default-features so the default il2cpp_v31 doesn't stack with
      # whichever version this matrix entry selects; the rest of the
      # previous default set is listed explicitly instead.
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --no-default-features --features=${{ matrix.unity }},${{ env.default_features }},retour -- --skip bindgen

      - name: Check for clippy warnings
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --examples --tests --no-default-features --features=${{ matrix.unity }},${{ env.default_features }},retour -- -D warnings

      - name: Check formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  tests-android:
    name: Android Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        unity: [il2cpp_v31, unity2018]
        arch: [armv8, armv7]
        include:
          - arch: armv8
            rust-target: aarch64-linux-android
            ndk-target: arm64-v8a
          - arch: armv7
            rust-target: armv7-linux-androideabi
            ndk-target: armeabi-v7a

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: ${{ matrix.rust-target }}
          profile: minimal
          override: true
          components: clippy, rustfmt
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target/
          key: tests-android-${{ matrix.arch }}-${{ matrix.unity }}-${{ hashFiles('**/Cargo.toml') }}

      - uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-ndk

      # Building with default features (bindgen) shells out to qpm in
      # libil2cpp's build.rs
      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: false
          cache: false
          resolve_ndk: false

      # --no-default-features so the default il2cpp_v31 doesn't stack with
      # whichever version this matrix entry selects; the rest of the
      # previous default set is listed explicitly instead (inline_hook in
      # place of retour, since this targets Android).
      - name: Check for clippy warnings
        uses: actions-rs/cargo@v1
        with:
          command: ndk
          args: --target=${{ matrix.ndk-target }} --platform=24 clippy --workspace --examples --no-default-features --features=${{ matrix.unity }},${{ env.default_features }},inline_hook
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Check formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
