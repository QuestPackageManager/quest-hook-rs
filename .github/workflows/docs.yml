name: Docs
on:
  push:
    branches:
      - master

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          override: true
          components: rust-docs

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target/
          key: docs-${{ hashFiles('**/Cargo.toml') }}

      # Building with default features (bindgen) shells out to qpm in
      # libil2cpp's build.rs
      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: false
          cache: false
          resolve_ndk: false

      - name: Generate docs
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --workspace --no-deps --features=il2cpp_v31,serde

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          publish_branch: docs
