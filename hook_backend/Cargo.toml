[package]
name = "hook_backend"
version = "0.1.0"
authors = [
    "StackDoubleFlow <ojaslandge@gmail.com>",
    "Raphaël Thériault <self@raftar.io>",
]
edition = "2021"

[dependencies]
cfg-if = "1"

[target.'cfg(all(target_arch = "aarch64", target_os = "android"))'.dependencies]
flamingo_rs = { git = "https://github.com/QuestPackageManager/flamingo_rs.git", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
retour = { version = "0.4.0-alpha.3", optional = true }

[build-dependencies]
cc = "1"

[features]
# Vendored And64InlineHook/inlineHook.c backend (AArch64 + ARMv7 Android)
inline_hook = []
# flamingo_rs backend (AArch64 Android only)
flamingo = ["dep:flamingo_rs"]
# retour backend, used on non-Android targets
retour = ["dep:retour"]
