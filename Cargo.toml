[workspace]
members = ["proc_macros", "hook_backend", "libil2cpp", "quest_build_helper"]

[package]
name = "quest_hook"
version = "0.1.0"
authors = [
    "StackDoubleFlow <ojaslandge@gmail.com>",
    "Raphaël Thériault <self@raftar.io>",
]
repository = "https://github.com/StackDoubleFlow/quest-hook-rs.git"
license = "MIT"
edition = "2021"

[dependencies]
quest_hook_proc_macros = { path = "./proc_macros" }
hook_backend = { path = "./hook_backend", default-features = false }
libil2cpp = { path = "./libil2cpp", default-features = false }
cfg-if = "1"
tracing = { version = "0.1", features = [
    "std",
], default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, optional = true }
tracing-error = { version = "0.2", default-features = false, optional = true }
paranoid-android = { version = "0.2", optional = true }
thiserror = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "smallvec",
], default-features = false, optional = true }

[dev-dependencies]
trybuild = "1"

[features]
default = ["util", "cache", "il2cpp_v31", "bindgen", "inline_hook", "retour"]
il2cpp_v31 = ["libil2cpp/il2cpp_v31"]
il2cpp_v29 = ["libil2cpp/il2cpp_v29"]
il2cpp_v24 = ["libil2cpp/il2cpp_v24"]
unity2018 = ["libil2cpp/unity2018"]
util = ["tracing", "tracing-error", "tracing-subscriber", "paranoid-android"]
cache = ["libil2cpp/cache"]
serde = ["libil2cpp/serde"]
trace = ["libil2cpp/trace"]
bindgen = ["libil2cpp/bindgen"]
inline_hook = ["hook_backend/inline_hook"]
flamingo = ["hook_backend/flamingo"]
retour = ["hook_backend/retour"]

xref = ["libil2cpp/xref"]

[[example]]
name = "hello_world"
crate-type = ["cdylib"]
required-features = ["util"]
[[example]]
name = "custom_type"
crate-type = ["cdylib"]
required-features = ["util"]
[[example]]
name = "hook_priority"
crate-type = ["cdylib"]
required-features = ["util", "flamingo"]
[[example]]
name = "gc_alloc"
crate-type = ["cdylib"]
required-features = ["util", "xref"]
[[example]]
name = "thread"
crate-type = ["cdylib"]
required-features = ["util"]
[[example]]
name = "generics"
crate-type = ["cdylib"]
required-features = ["util"]
[[example]]
name = "runtime_types"
crate-type = ["cdylib"]
required-features = ["util"]
